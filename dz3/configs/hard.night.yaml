data:
  train_path: data/train/train.jsonl
  val_path: data/val/val.jsonl
  hard_train_path: data/hard/hard_train.jsonl
  hard_val_path: data/hard/hard_val.jsonl

model:
  baseline: Qwen/Qwen2.5-0.5B-Instruct
  backend: auto

sampling:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 96

hard_mining:
  prefilter_n: 16
  certify_n: 128
  hard_train_target: 1024
  hard_val_target: 64
  seed: 2026
  seed_train: 2026
  seed_val: 2026
  certify_seeds: [2026, 2027, 2028]
