data:
  train_path: data/train/train.jsonl
  val_path: data/val/val.jsonl
  hard_train_path: data/hard/hard_train.jsonl
  hard_val_path: data/hard/hard_val.jsonl
  prediction_dir: results/predictions
  curves_dir: results/curves

models:
  baseline: Qwen/Qwen2.5-0.5B-Instruct
  grpo: outputs/grpo/merged_model
  sft: outputs/sft
  sft_grpo: outputs/sft_grpo/merged_model
  srft: outputs/srft

model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  max_seq_length: 512
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/grpo/runs
  max_steps: 600
  learning_rate: 5.0e-6
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_generations: 4
  max_prompt_length: 416
  max_completion_length: 96
  mask_truncated_completions: true
  temperature: 0.7
  top_p: 0.95
  max_tokens: 96
  use_vllm: false
  log_samples: true
  log_every_calls: 20
  log_max_items: 3
  log_max_chars: 240
  logging_steps: 10
  save_steps: 100
  seed: 2026

sft:
  output_dir: outputs/sft
  learning_rate: 2.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_length: 512
  logging_steps: 10
  save_steps: 100
  seed: 2026

srft:
  output_dir: outputs/srft
  learning_rate: 2.0e-5
  steps: 200
  batch_size: 2
  w_sft_coef: 0.5
  w_rl_coef: 0.1
  clip_eps: 0.2
  seed: 2026

inference:
  backend: auto
  temperature: 0.7
  top_p: 0.95
  max_tokens: 96

passk:
  n: 128
  k_values: [1, 4, 8, 16, 32, 64, 128]

dry_run:
  num_examples: 16
  steps: 2
